<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pesquisa - POEV</title>
  <style>
    body {
      margin: 0;
      background-color: #121212;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      width: 90%;
      text-align: center;
    }
    h1 {
      margin: 20px 0;
      font-size: 2rem;
      color: #ffffff;
    }
    p {
      font-size: 1.1rem;
      margin-bottom: 30px;
      color: #cccccc;
    }
    .btn-pesquisa {
      background-color: #007bff;
      color: white;
      padding: 15px 30px;
      font-size: 1.2rem;
      text-decoration: none;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: background-color 0.3s;
      display: inline-block;
    }
    .btn-pesquisa:hover {
      background-color: #0056b3;
      color: white;
      text-decoration: none;
    }
    .info {
      margin-top: 30px;
      padding: 15px;
      background-color: #1e1e1e;
      border-radius: 8px;
      font-size: 0.9rem;
      color: #aaaaaa;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Pesquisa de Satisfação</h1>
    <p>Participe da nossa pesquisa e ajude-nos a melhorar nossos serviços!</p>
    
    <a href="https://forms.office.com/pages/responsepage.aspx?id=V0Tn3lHXEUClxERWDPi0FRyH-_AxeDJBuVwaWLaxbI5UOEY5RkREWTYzRDgzQUlOVVVDSFhSOTkzRC4u&origin=lprLink&route=shorturl" 
       target="_blank" 
       class="btn-pesquisa">
      Fazer Pesquisa
    </a>
    
    <div class="info">
      <p>A pesquisa é anônima e leva aproximadamente 5 minutos para ser concluída.</p>
      <p>Agradecemos sua participação!</p>
    </div>
  </div>
</body>
</html>
